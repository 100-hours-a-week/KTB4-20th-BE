spring:
  application:
    name: planit-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/planit?connectionTimeZone=Asia/Seoul}
    username: ${DB_USERNAME:planit}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-migration-naming: true
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

planit:
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_API_KEY}
    connect-timeout: 3s
    read-timeout: 30s
  image:
    default-profile-url: ${DEFAULT_PROFILE_IMAGE_URL:http://localhost:8080/images/default-profile.svg}
  auth:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    allowed-frontend-origin: ${ALLOWED_FRONTEND_ORIGIN:http://localhost:5173}
    cookie-secure: ${AUTH_COOKIE_SECURE}

    oauth-state-cookie-name: planit_oauth_state
    oauth-state-cookie-max-age: 10m

    jwt:
      secret-base64: ${JWT_HS256_SECRET_BASE64}
      issuer: planit-auth
      audience: planit-api
      access-token-ttl: 15m

    kakao:
      client-id: ${KAKAO_REST_API_KEY}
      client-secret: ${KAKAO_CLIENT_SECRET}
      admin-key: ${KAKAO_ADMIN_KEY}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/oauth/callback}
      authorization-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      unlink-uri: https://kapi.kakao.com/v1/user/unlink

server:
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /api
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    db:
      enabled: true
