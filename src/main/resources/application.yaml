spring:
  application:
    name: planit-backend
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/planit?connectionTimeZone=Asia/Seoul}
    username: ${DB_USERNAME:planit}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:planit-backend}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:planit}
    # 발행 결과를 confirm으로 받고, 라우팅할 큐가 없는 메시지는 return으로 돌려받는다
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-migration-naming: true
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

planit:
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_API_KEY}
    connect-timeout: 3s
    read-timeout: 120s
  mq:
    # 발행 후 이 시간 안에 confirm이 오지 않으면 유실로 본다. 부하 테스트의 confirm 지연 max로 확정한다
    confirm-timeout: 5s
    # 큐 차단으로 접수하지 않을 때 503 응답의 Retry-After
    retry-after: 60s
    monitor:
      management-base-url: ${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
      virtual-host: ${spring.rabbitmq.virtual-host}
      username: ${RABBITMQ_MONITOR_USERNAME:planit-monitor}
      password: ${RABBITMQ_MONITOR_PASSWORD:}
      # 5초마다 큐 7개를 차례로 조회하므로, 모두 시간 초과여도 한 번의 감시가 길게 밀리지 않게 짧게 둔다
      connect-timeout: 300ms
      read-timeout: 500ms
      task-block-ratio: 0.95
      task-unblock-ratio: 0.50
      dlq-block-ratio: 0.90
      dlq-unblock-ratio: 0.50
  image:
    default-profile-url: ${DEFAULT_PROFILE_IMAGE_URL:http://localhost:8080/images/default-profile.svg}
    bucket: ${IMAGE_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    read-url-ttl: 5m
    max-profile-bytes: 5242880
    max-mission-bytes: 5242880
    download-connect-timeout: 3s
    download-read-timeout: 5s
  auth:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    allowed-frontend-origin: ${ALLOWED_FRONTEND_ORIGIN:http://localhost:5173}
    cookie-secure: ${AUTH_COOKIE_SECURE}

    oauth-state-cookie-name: planit_oauth_state
    oauth-state-cookie-max-age: 10m

    jwt:
      secret-base64: ${JWT_HS256_SECRET_BASE64}
      issuer: planit-auth
      audience: planit-api
      access-token-ttl: 15m

    kakao:
      client-id: ${KAKAO_REST_API_KEY}
      client-secret: ${KAKAO_CLIENT_SECRET}
      admin-key: ${KAKAO_ADMIN_KEY}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/oauth/callback}
      authorization-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      unlink-uri: https://kapi.kakao.com/v1/user/unlink

server:
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /api
      discovery:
        enabled: false
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    db:
      enabled: true
    # RabbitMQ 장애 중에도 Outbox에 작업을 저장하며 동작하므로 서버 health에 포함하지 않는다
    rabbit:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

sentry:
  # SENTRY_DSN이 없으면 Sentry가 꺼진다. 운영 서버에만 설정한다.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
