name: "🚀 기능 개발"
description: "새로운 기능을 구현합니다."
title: "[Feature] "
labels:
  - "feature"
body:
  - type: markdown
    attributes:
      value: |
        새로운 기능 구현을 위한 이슈입니다.
        구현하려는 기능의 목적과 완료 조건을 명확하게 작성해주세요.

  - type: textarea
    id: problem
    attributes:
      label: "📌 문제 상황"
      description: "현재 어떤 문제 또는 요구사항이 있는지 작성해주세요."
      placeholder: |
        예) 여행 그룹을 생성한 사용자가 다른 사용자를 초대할 방법이 없음.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "💡 구현 내용"
      description: "문제를 해결하기 위해 구현할 기능을 작성해주세요."
      placeholder: |
        예) 초대 링크를 생성하고, 해당 링크를 통해 사용자가 그룹에 참여할 수 있도록 구현함.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 상세 작업"
      description: "구현해야 할 작업을 체크리스트 형태로 작성해주세요."
      placeholder: |
        - [ ] 초대 코드 생성 로직 구현
        - [ ] 초대 링크 조회 API 구현
        - [ ] 초대 수락 API 구현
        - [ ] 만료된 초대 처리
        - [ ] 테스트 코드 작성
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "🎯 완료 조건"
      description: "이 이슈가 완료되었다고 판단할 수 있는 조건을 작성해주세요."
      placeholder: |
        - 초대 링크를 통해 정상적으로 그룹에 참여할 수 있음
        - 만료된 링크 요청 시 적절한 오류를 반환함
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "📎 참고 자료"
      description: "관련 이슈, 문서, API 명세, 디자인 등이 있다면 작성해주세요."
      placeholder: |
        - 관련 이슈: #123
        - API 명세:
