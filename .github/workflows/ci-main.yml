name: BE Main CI

on:
  push:
    branches: [main]

concurrency:
  group: backend-main-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Build and Publish Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          APP_VERSION=$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)

          if [[ -z "$APP_VERSION" ]]; then
            echo "::error::build.gradle version is missing."
            exit 1
          fi

          docker build \
            --platform linux/amd64 \
            --secret id=SENTRY_AUTH_TOKEN,env=SENTRY_AUTH_TOKEN \
            --build-arg SENTRY_RELEASE="planit-backend@${APP_VERSION}+${GITHUB_SHA::7}" \
            -t planit-backend:ci .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image and resolve digest
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE_TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag planit-backend:ci "$IMAGE_URI"
          docker push "$IMAGE_URI"

          DIGEST=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'images[0].imageId.imageDigest' \
            --output text)

          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy and Verify
    needs: publish
    if: ${{ vars.CD_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.BACKEND_ECS_SERVICE }}
      CONTAINER_NAME: ${{ vars.BACKEND_CONTAINER_NAME }}
      HEALTHCHECK_URL: ${{ vars.BACKEND_HEALTHCHECK_URL }}

    steps:
      - name: Configure deployment credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Register and deploy ECS task definition
        run: |
          set -euo pipefail

          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${IMAGE_DIGEST}"

          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEF" \
            --query taskDefinition \
            --output json > "$RUNNER_TEMP/task-definition.json"

          jq \
            --arg image "$IMAGE_URI" \
            --arg container_name "$CONTAINER_NAME" \
            '
              del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
              | (.containerDefinitions | map(select(.name == $container_name)) | length) as $match_count
              | if $match_count == 1
                then .
                else error("expected exactly one target container")
                end
              | .containerDefinitions |= map(
                  if .name == $container_name
                  then .image = $image
                  else .
                  end
                )
            ' \
            "$RUNNER_TEMP/task-definition.json" \
            > "$RUNNER_TEMP/task-definition-next.json"

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/task-definition-next.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --query 'service.taskDefinition' \
            --output text

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json > "$RUNNER_TEMP/service.json"

          jq -e --arg task_def "$TASK_DEF_ARN" '
            (.failures | length) == 0 and
            (.services | length) == 1 and
            (.services[0] |
              .taskDefinition == $task_def and
              (.deployments | length) == 1 and
              .deployments[0].taskDefinition == $task_def and
              .deployments[0].rolloutState == "COMPLETED"
            )
          ' "$RUNNER_TEMP/service.json" > /dev/null || {
            echo "::error::The target task definition did not complete deployment."
            exit 1
          }

          {
            echo "### Backend ECS deployment"
            echo "- Image: $IMAGE_URI"
            echo "- Task definition: $TASK_DEF_ARN"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public health endpoint
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --output "$RUNNER_TEMP/health.json" \
              --write-out '%{http_code}' \
              --max-time 10 \
              "$HEALTHCHECK_URL" || true)

            if [[ "$HTTP_STATUS" == "200" ]] &&
              jq -e '.status == "UP"' "$RUNNER_TEMP/health.json" > /dev/null 2>&1; then
              echo "- Health check: passed" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            sleep 10
          done

          echo "::error::Public health check failed: $HEALTHCHECK_URL"
          exit 1
